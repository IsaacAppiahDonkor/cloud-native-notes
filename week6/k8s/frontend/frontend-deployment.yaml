apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-native-notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html

        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf

      volumes:
      - name: html
        configMap:
          name: frontend-html

      - name: nginx-config
        configMap:
          name: frontend-nginx-config

