apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-native-notes-ingress
  namespace: cloud-native-notes
spec:
  ingressClassName: nginx
  rules:
  - host: notes.127-0-0-1.nip.io  # Using nip.io for local testing
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
